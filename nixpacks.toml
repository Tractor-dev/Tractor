[phases.setup]
nixPkgs = ["nodejs-18_x", "python39"]

[phases.install]
cmds = [
  "cd tractor-game-simulator/server && npm install --production"
]

[phases.build]
cmds = [
  "cd tractor-game-simulator/client && npm install && npm run build"
]

[start]
cmd = "cd tractor-game-simulator/server && node src/index.js"
