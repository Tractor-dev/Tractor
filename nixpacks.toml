[phases.setup]
nixPkgs = ["nodejs_20", "python3"]

[phases.install]
cmds = [
  "cd tractor-game-simulator/server && npm install --production"
]

[phases.build]
cmds = [
  "cd tractor-game-simulator/client && npm install --include=dev && npm run build"
]

[start]
cmd = "cd tractor-game-simulator/server && node src/index.js"
